name: Refresh AIA ILP data
on:
  push:
    paths:
      - "pipeline/**"
      - "data/funds.json"
      - ".github/workflows/refresh.yml"
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python pipeline/refresh.py
      - name: Publish refreshed data
        run: |
          mkdir -p frontend/data
          cp data/live.json frontend/data/live.json
          cp data/funds.json frontend/data/funds.json
          git config user.name "AIA ILP Dashboard Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/live.json frontend/data/live.json frontend/data/funds.json
          git diff --cached --quiet || git commit -m "Refresh dashboard data"
          git push
