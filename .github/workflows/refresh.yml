name: Publish AIA ILP performance snapshot
on:
  push:
    paths:
      - "data/live.json"
      - "data/funds.json"
      - "frontend/**"
      - ".github/workflows/refresh.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare dashboard data
        run: |
          mkdir -p frontend/data
          cp data/live.json frontend/data/live.json
          cp data/funds.json frontend/data/funds.json
      - name: Commit published data
        run: |
          git config user.name "AIA ILP Dashboard Bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/data/live.json frontend/data/funds.json
          git diff --cached --quiet || git commit -m "Publish performance snapshot"
          git push
